name: Bug report
description: Report a problem with the extension
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open YouTube...\n2. Click...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and version
      placeholder: Chrome 130 on Windows 11
